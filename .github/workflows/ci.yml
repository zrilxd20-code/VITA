name: VITA CI Quality & Security
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Syntax, Parity & Secret Checks
        run: npm run check

      - name: Run Web Security & Anti-Softlock Tests
        run: npm test
